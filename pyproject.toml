[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-storage-hotspot-detection"
version = "0.1.0"
description = "Multi-dimensional load imbalance detection and hotspot identification for cloud storage systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Junho Jo"}
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]

[project.scripts]
hotspot-detection = "hotspot_detection.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

